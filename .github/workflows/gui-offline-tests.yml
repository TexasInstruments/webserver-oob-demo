name: GUI Offline Tests

on:
  push:
  pull_request:

jobs:
  gui-offline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Node.js + webserver dependencies ─────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: common/webserver/package.json

      - name: Install webserver dependencies
        run: npm install
        working-directory: common/webserver

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build AM62D frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_DEVICE: am62dxx

      # ── Python + Robot Framework ──────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/gui/requirements.txt

      - name: Install Robot Framework dependencies
        run: pip install -r tests/gui/requirements.txt

      # ── Playwright / Chromium ─────────────────────────────────────────────
      # rfbrowser init downloads the Playwright Node wrapper + Chromium binary
      # (~170 MB). Cache the binary by hashing the requirements file so the
      # download is skipped on unchanged dependency runs.
      - name: Cache Playwright Chromium
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/gui/requirements.txt') }}

      - name: Initialise rfbrowser (downloads Chromium if not cached)
        run: rfbrowser init chromium

      # Chromium needs several shared libraries that are not bundled with the
      # binary. Install them unconditionally — they are OS packages and are not
      # part of the Playwright cache.
      - name: Install Chromium OS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libatspi2.0-0 libx11-6 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      # ── Robot Framework test run ──────────────────────────────────────────
      # WEBSERVER_OOB_DEMO_ROOT points to the checked-out repo so the test
      # suite uses the current branch's code instead of cloning upstream.
      # The frontend build (above) already placed the dist at the path the
      # server expects: devices/am62dxx/app/vue-dist/.
      - name: Run offline GUI tests
        working-directory: tests/gui
        env:
          WEBSERVER_OOB_DEMO_ROOT: ${{ github.workspace }}
        run: |
          robot \
            --outputdir ${{ github.workspace }}/robot-results \
            --loglevel INFO \
            am62dxx_webserver_oob_gui_offline.robot

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: robot-results/
          if-no-files-found: warn
