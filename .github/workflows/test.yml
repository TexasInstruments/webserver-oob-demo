name: Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: common/webserver/package.json

      - name: Install dependencies
        run: npm install
        working-directory: common/webserver

      - name: Run tests
        run: npm test
        working-directory: common/webserver
